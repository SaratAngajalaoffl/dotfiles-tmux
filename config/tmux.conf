# tmux config — starting point

# remap prefix from Ctrl-b to Ctrl-o
unbind C-b
set -g prefix C-o
bind-key C-o send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10

# preserve modifiers (e.g. Ctrl+Shift+L, Shift+Return) when forwarding keys to panes;
# "always" is required (not "on") because the request has to reach tmux through
# nested terminals (Ghostty -> tmux -> nvim :terminal -> claude), and that request
# doesn't reliably propagate through nvim's terminal emulation
set -s extended-keys always

# vi-style copy mode: prefix + [ enters, vim motions to move,
# v to select, y to copy (also copies to system clipboard via wl-copy)
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind-key ] paste-buffer
